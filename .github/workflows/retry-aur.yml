name: Retry AUR Workflows

on:
  workflow_run:
    workflows:
      - Update AUR Package
      - Bump Package Release
    types:
      - completed

permissions:
  actions: write

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest

    steps:
      - name: Re-run failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          echo "工作流第 ${RUN_ATTEMPT}/3 次运行失败，重新运行失败的任务"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/rerun-failed-jobs"

          expected_attempt=$((RUN_ATTEMPT + 1))
          for check in $(seq 1 120); do
            run_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")
            current_attempt=$(jq -r '.run_attempt' <<< "$run_json")
            status=$(jq -r '.status' <<< "$run_json")
            conclusion=$(jq -r '.conclusion // empty' <<< "$run_json")

            echo "检查 ${check}/120: attempt=${current_attempt}, status=${status}, conclusion=${conclusion:-等待中}"

            if (( current_attempt >= expected_attempt )) && [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" == "success" ]]; then
                echo "原工作流第 ${current_attempt} 次运行成功"
                exit 0
              fi
              echo "原工作流第 ${current_attempt} 次运行失败: $conclusion"
              exit 1
            fi

            sleep 10
          done

          echo "等待原工作流完成超时"
          exit 1
