name: Update AUR Package

on:
  schedule:
    # GitHub Release 镜像任务在北京时间 9:00 运行，本任务在 10:00 消费其产物。
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  MIN_ZIP_SIZE: 104857600

concurrency:
  group: apifox-aur-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate latest GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest")
          TAG=$(jq -r '.tag_name // empty' <<< "$RELEASE_JSON")
          VERSION="${TAG#v}"

          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+)+$ ]]; then
            echo "错误: 最新 Release tag 无效: ${TAG:-空}"
            exit 1
          fi

          X86_64_NAME="Apifox-linux-${VERSION}.zip"
          AARCH64_NAME="Apifox-linux-${VERSION}-arm64.zip"

          asset_value() {
            local name="$1"
            local field="$2"
            jq -r --arg name "$name" \
              ".assets[] | select(.name == \$name) | .${field}" <<< "$RELEASE_JSON"
          }

          X86_64_SIZE=$(asset_value "$X86_64_NAME" size)
          AARCH64_SIZE=$(asset_value "$AARCH64_NAME" size)
          X86_64_DIGEST=$(asset_value "$X86_64_NAME" digest)
          AARCH64_DIGEST=$(asset_value "$AARCH64_NAME" digest)

          if [[ ! "$X86_64_SIZE" =~ ^[0-9]+$ || "$X86_64_SIZE" -lt "$MIN_ZIP_SIZE" ]]; then
            echo "错误: $X86_64_NAME 资产缺失或体积异常: ${X86_64_SIZE:-空} bytes"
            exit 1
          fi
          if [[ ! "$AARCH64_SIZE" =~ ^[0-9]+$ || "$AARCH64_SIZE" -lt "$MIN_ZIP_SIZE" ]]; then
            echo "错误: $AARCH64_NAME 资产缺失或体积异常: ${AARCH64_SIZE:-空} bytes"
            exit 1
          fi
          if [[ ! "$X86_64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ || \
                ! "$AARCH64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "错误: Release 资产缺少有效的 GitHub SHA-256 digest"
            exit 1
          fi

          CHECKSUM_DIR="$RUNNER_TEMP/apifox-checksums"
          mkdir -p "$CHECKSUM_DIR"
          for attempt in 1 2 3; do
            rm -f "$CHECKSUM_DIR/SHA256SUMS"
            if gh release download "$TAG" --pattern SHA256SUMS --dir "$CHECKSUM_DIR"; then
              break
            fi
            echo "SHA256SUMS 下载失败 (第 ${attempt}/3 次尝试)"
            if (( attempt < 3 )); then sleep $((attempt * 5)); continue; fi
            exit 1
          done

          X86_64_SHA256=$(awk -v name="$X86_64_NAME" '$2 == name { print $1 }' "$CHECKSUM_DIR/SHA256SUMS")
          AARCH64_SHA256=$(awk -v name="$AARCH64_NAME" '$2 == name { print $1 }' "$CHECKSUM_DIR/SHA256SUMS")

          if [[ "sha256:${X86_64_SHA256}" != "$X86_64_DIGEST" || \
                "sha256:${AARCH64_SHA256}" != "$AARCH64_DIGEST" ]]; then
            echo "错误: SHA256SUMS 与 GitHub 资产 digest 不一致"
            exit 1
          fi

          echo "Release $TAG 校验通过"
          echo "x86_64: ${X86_64_SIZE} bytes, ${X86_64_SHA256}"
          echo "aarch64: ${AARCH64_SIZE} bytes, ${AARCH64_SHA256}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "x86_64_sha256=$X86_64_SHA256" >> "$GITHUB_OUTPUT"
          echo "aarch64_sha256=$AARCH64_SHA256" >> "$GITHUB_OUTPUT"

      - name: Reconcile package metadata
        id: package
        env:
          VERSION: ${{ steps.release.outputs.version }}
          X86_64_SHA256: ${{ steps.release.outputs.x86_64_sha256 }}
          AARCH64_SHA256: ${{ steps.release.outputs.aarch64_sha256 }}
        shell: bash
        run: |
          bash .github/scripts/update-package-metadata.sh \
            "$VERSION" "$X86_64_SHA256" "$AARCH64_SHA256" "$GITHUB_REPOSITORY"

      - name: Compare AUR package
        id: aur
        shell: bash
        run: |
          set -euo pipefail

          AUR_DIR="$RUNNER_TEMP/aur-repo"
          for attempt in 1 2 3; do
            rm -rf "$AUR_DIR"
            if git clone https://aur.archlinux.org/apifox-appimage.git "$AUR_DIR"; then
              break
            fi
            echo "AUR 仓库克隆失败 (第 ${attempt}/3 次尝试)"
            if (( attempt < 3 )); then sleep $((attempt * 10)); continue; fi
            exit 1
          done

          cp PKGBUILD .SRCINFO "$AUR_DIR/"
          git -C "$AUR_DIR" add PKGBUILD .SRCINFO

          if git -C "$AUR_DIR" diff --staged --quiet; then
            echo "AUR 软件包已是最新状态"
            echo "need_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "AUR 软件包需要同步"
            git -C "$AUR_DIR" diff --staged --stat
            echo "need_update=true" >> "$GITHUB_OUTPUT"
          fi
          echo "dir=$AUR_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup SSH for AUR
        if: steps.aur.outputs.need_update == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur

          for attempt in 1 2 3; do
            if ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            echo "ssh-keyscan 失败 (第 ${attempt}/3 次尝试)"
            if [ $attempt -lt 3 ]; then sleep $((attempt * 5)); continue; fi
            exit 1
          done

          cat >> ~/.ssh/config << EOF
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
          EOF

      - name: Push to AUR
        if: steps.aur.outputs.need_update == 'true'
        env:
          AUR_DIR: ${{ steps.aur.outputs.dir }}
          VERSION: ${{ steps.package.outputs.version }}
          PKGREL: ${{ steps.package.outputs.pkgrel }}
        shell: bash
        run: |
          set -euo pipefail

          git -C "$AUR_DIR" config user.name "GitHub Actions Bot"
          git -C "$AUR_DIR" config user.email "actions@github.com"
          git -C "$AUR_DIR" remote set-url origin ssh://aur@aur.archlinux.org/apifox-appimage.git
          git -C "$AUR_DIR" commit -m "Update to ${VERSION}-${PKGREL}"

          for attempt in 1 2 3; do
            if git -C "$AUR_DIR" push origin master; then
              break
            fi
            echo "AUR 推送失败 (第 ${attempt}/3 次尝试)"
            if (( attempt < 3 )); then sleep $((attempt * 10)); continue; fi
            exit 1
          done

      - name: Commit package metadata to GitHub
        if: steps.package.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.package.outputs.version }}
          PKGREL: ${{ steps.package.outputs.pkgrel }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to ${VERSION}-${PKGREL}"

          for attempt in 1 2 3; do
            if git pull --rebase origin master && git push origin master; then
              break
            fi
            echo "GitHub 推送失败 (第 ${attempt}/3 次尝试)"
            if (( attempt < 3 )); then sleep $((attempt * 10)); continue; fi
            exit 1
          done

  retry:
    needs: update
    if: failure() && github.run_attempt < 3
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 重新运行失败的任务
        uses: actions/github-script@v7
        with:
          script: |
            console.log('第 ${{ github.run_attempt }} 次尝试失败，正在触发重试...');
            await github.rest.actions.rerunWorkflowFailedJobs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
