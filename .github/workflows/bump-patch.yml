name: Bump Package Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: apifox-aur-update
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bump pkgrel
        id: bump
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(sed -n 's/^pkgver=//p' PKGBUILD)
          CURRENT_PKGREL=$(sed -n 's/^pkgrel=//p' PKGBUILD)

          if [[ ! "$CURRENT_PKGREL" =~ ^[0-9]+$ ]]; then
            echo "不支持的 pkgrel: $CURRENT_PKGREL"
            exit 1
          fi

          NEW_PKGREL=$((CURRENT_PKGREL + 1))
          sed -i "s/^pkgrel=.*/pkgrel=${NEW_PKGREL}/" PKGBUILD
          sed -i "s/^[[:space:]]*pkgrel = .*/\tpkgrel = ${NEW_PKGREL}/" .SRCINFO

          echo "软件包版本: ${VERSION}-${CURRENT_PKGREL} -> ${VERSION}-${NEW_PKGREL}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pkgrel=$NEW_PKGREL" >> "$GITHUB_OUTPUT"

      - name: Setup SSH for AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur

          for attempt in 1 2 3; do
            if ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            echo "ssh-keyscan 失败 (第 ${attempt}/3 次尝试)"
            if [ $attempt -lt 3 ]; then sleep $((attempt * 5)); continue; fi
            exit 1
          done

          cat >> ~/.ssh/config << EOF
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
          EOF

      - name: Push to AUR
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          PKGREL: ${{ steps.bump.outputs.pkgrel }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          for attempt in 1 2 3; do
            if git clone ssh://aur@aur.archlinux.org/apifox-appimage.git /tmp/aur-repo; then
              break
            fi
            echo "AUR 仓库克隆失败 (第 ${attempt}/3 次尝试)"
            rm -rf /tmp/aur-repo
            if [ $attempt -lt 3 ]; then sleep $((attempt * 10)); continue; fi
            exit 1
          done

          cp PKGBUILD .SRCINFO /tmp/aur-repo/
          cd /tmp/aur-repo
          git add PKGBUILD .SRCINFO
          git diff --staged --quiet || git commit -m "Bump pkgrel to ${VERSION}-${PKGREL}"

          if ! git diff origin/master --quiet; then
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "AUR 推送失败 (第 ${attempt}/3 次尝试)"
              if [ $attempt -lt 3 ]; then sleep $((attempt * 10)); continue; fi
              exit 1
            done
          fi

      - name: Commit to GitHub
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          PKGREL: ${{ steps.bump.outputs.pkgrel }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git add PKGBUILD .SRCINFO
          git diff --staged --quiet || git commit -m "Bump pkgrel to ${VERSION}-${PKGREL}"

          for attempt in 1 2 3; do
            if git pull --rebase origin master && git push; then
              break
            fi
            echo "GitHub 推送失败 (第 ${attempt}/3 次尝试)"
            if [ $attempt -lt 3 ]; then sleep $((attempt * 10)); continue; fi
            exit 1
          done

  retry:
    needs: bump
    if: failure() && github.run_attempt < 3
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 重新运行失败的任务
        uses: actions/github-script@v7
        with:
          script: |
            console.log('第 ${{ github.run_attempt }} 次尝试失败，正在触发重试...');
            await github.rest.actions.rerunWorkflowFailedJobs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
